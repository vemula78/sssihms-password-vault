[project]
name = "sssihms_password_vault"
authors = [{ name = "Praveen Vemula", email = "vemula78@gmail.com" }]
description = "Organizational password manager for SSSIHMS: department-scoped shared credentials with role-based access, reveal auditing and rotation reminders."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "sssihms_password_vault"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "E101", "E402", "E501", "W191", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["sssihms_password_vault/vault/tests"]
